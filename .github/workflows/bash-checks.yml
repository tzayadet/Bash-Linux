name: Bash validation

on:
  push:
    branches: [main]
    paths:
      - "EchoHello.sh"
      - ".github/workflows/bash-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "EchoHello.sh"
      - ".github/workflows/bash-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n EchoHello.sh
      - name: Run script smoke test
        run: test "$(bash EchoHello.sh)" = "HELLO"
